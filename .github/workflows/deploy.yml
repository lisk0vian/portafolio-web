name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Recoge casos de estudio nuevos del repo de datos (las páginas de caso se generan en build).
  schedule:
    - cron: "0 11 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        env:
          PUBLIC_DATA_URL: https://raw.githubusercontent.com/lisk0vian/portafolio-api/main
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
