name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Recoge casos de estudio nuevos del repo de datos (las páginas de caso se generan en build).
  schedule:
    - cron: "0 11 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 22
        env:
          PUBLIC_DATA_URL: https://raw.githubusercontent.com/lisk0vian/portafolio-api/main
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Verifica el sitio ya publicado con Lighthouse CI (móvil, 3 corridas por página).
  # Falla si rendimiento < 90, accesibilidad/buenas prácticas/SEO < 95, LCP > 2,5 s o CLS > 0,1.
  lighthouse:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lighthouse CI
        env:
          SITE: https://lisk0vian.github.io/portafolio-web
        run: |
          npx --yes @lhci/cli@0.15.1 autorun \
            --collect.url="$SITE/" \
            --collect.url="$SITE/en/" \
            --collect.url="$SITE/casos/chatcrm/" \
            --collect.url="$SITE/certificaciones/"
      - name: Reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lhci-report
